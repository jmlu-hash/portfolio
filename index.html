<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计作品集 · jmlu-hash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f7f5;color:#1a1a1a;line-height:1.6}
header{background:#111;color:#fff;padding:72px 24px;text-align:center}
header h1{font-size:44px;letter-spacing:4px}
header p{margin-top:12px;color:#bbb;font-size:15px}
.container{max-width:1080px;margin:0 auto;padding:56px 24px}
h2{font-size:22px;margin-bottom:24px;padding-left:12px;border-left:4px solid #c0392b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-bottom:56px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:6px;overflow:hidden;transition:.2s}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.1);transform:translateY(-2px)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee;display:block}
.card .meta{padding:14px}
.card .meta strong{font-size:15px}
.card .meta span{display:block;color:#888;font-size:12px;margin-top:4px}
.empty{border:1px dashed #ccc;border-radius:6px;min-height:200px;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px;text-align:center;padding:20px}
footer{text-align:center;padding:32px;color:#999;font-size:13px;border-top:1px solid #e5e5e5}
</style>
</head>
<body>
<header>
  <h1>设计作品集</h1>
  <p>海报 · 证照 · 展板文化墙</p>
</header>
<div class="container">
  <h2>海报设计</h2>
  <div class="grid"><div class="card"><div class="empty">作品待上传至 posters/</div></div></div>
  <h2>证照 / 工作证</h2>
  <div class="grid"><div class="card"><div class="empty">作品待上传至 badges/</div></div></div>
  <h2>展板 / 文化墙</h2>
  <div class="grid"><div class="card"><div class="empty">作品待上传至 walls/</div></div></div>
</div>
<footer>© jmlu-hash · 设计作品集</footer>
</body>
</html>
